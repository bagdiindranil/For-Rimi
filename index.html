<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project: Why Are You Like This?</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    background:#071118;

    color:#f4f6f7;

    font-family:
    Georgia,
    "Times New Roman",
    serif;

    overflow-x:hidden;

}


/* =========================================================
   BACKGROUND
========================================================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:

    radial-gradient(
        circle at 15% 15%,
        rgba(88,150,180,.20),
        transparent 32%
    ),

    radial-gradient(
        circle at 85% 75%,
        rgba(150,110,160,.15),
        transparent 35%
    ),

    linear-gradient(
        135deg,
        #050d13,
        #102532,
        #071219
    );

    z-index:-5;

}


body::after{

    content:"";

    position:fixed;

    inset:0;

    background:

    repeating-linear-gradient(
        0deg,
        rgba(255,255,255,.018) 0px,
        rgba(255,255,255,.018) 1px,
        transparent 1px,
        transparent 4px
    );

    pointer-events:none;

    z-index:100;

}


/* =========================================================
   FLOATING LIGHTS
========================================================= */

.light{

    position:fixed;

    width:5px;
    height:5px;

    background:#c9e6ef;

    border-radius:50%;

    opacity:.3;

    animation:
    float 8s infinite ease-in-out;

    z-index:-1;

}

.light:nth-child(1){
    left:10%;
    top:30%;
}

.light:nth-child(2){
    left:75%;
    top:20%;
    animation-delay:2s;
}

.light:nth-child(3){
    left:45%;
    top:75%;
    animation-delay:4s;
}

.light:nth-child(4){
    left:85%;
    top:65%;
    animation-delay:1s;
}

@keyframes float{

    0%,100%{
        transform:translateY(0);
        opacity:.15;
    }

    50%{
        transform:translateY(-40px);
        opacity:.5;
    }

}


/* =========================================================
   INTRO
========================================================= */

#intro{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:30px;

}


.intro-content{

    width:min(800px,100%);

    animation:fadeUp 1.5s ease;

}


.overline{

    color:#91b3c1;

    font-size:11px;

    letter-spacing:6px;

    margin-bottom:28px;

}


.intro-title{

    font-size:
    clamp(42px,10vw,88px);

    font-weight:normal;

    letter-spacing:2px;

    margin-bottom:22px;

}


.intro-sub{

    color:#b7c8cf;

    font-size:18px;

    line-height:2;

}


.loading-box{

    margin:45px auto 0;

    max-width:500px;

    text-align:left;

}


.loading-label{

    display:flex;

    justify-content:space-between;

    color:#8daeba;

    font-size:11px;

    letter-spacing:2px;

    margin-bottom:9px;

}


.loading-bar{

    height:6px;

    background:rgba(255,255,255,.08);

    border-radius:20px;

    overflow:hidden;

}


.loading-progress{

    height:100%;

    width:0%;

    background:#bcd7df;

    transition:width .4s ease;

}


.enter{

    margin-top:40px;

    padding:15px 35px;

    background:transparent;

    border:1px solid #789aa9;

    border-radius:30px;

    color:white;

    font-size:13px;

    cursor:pointer;

    transition:.4s;

}


.enter:hover{

    background:#b9d2dc;

    color:#071118;

    transform:translateY(-4px);

}


/* =========================================================
   STORY
========================================================= */

#story{

    display:none;

}


.scene{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:90px 20px;

}


.scene-content{

    width:min(900px,100%);

    text-align:center;

    animation:sceneIn 1.2s ease;

}


.episode{

    font-size:10px;

    letter-spacing:6px;

    color:#7fa5b6;

    margin-bottom:20px;

}


.title{

    font-size:
    clamp(34px,7vw,65px);

    font-weight:normal;

    margin-bottom:30px;

}


.text{

    max-width:720px;

    margin:auto;

    color:#cad6db;

    font-size:18px;

    line-height:2;

}


/* =========================================================
   SYSTEM TERMINAL
========================================================= */

.terminal{

    max-width:700px;

    margin:45px auto;

    padding:25px;

    background:#050b0f;

    border:1px solid rgba(160,200,210,.2);

    border-radius:12px;

    text-align:left;

    font-family:monospace;

    box-shadow:
    0 20px 60px rgba(0,0,0,.4);

}


.terminal-top{

    color:#7699a8;

    font-size:11px;

    margin-bottom:18px;

}


.terminal-line{

    color:#b9d5dd;

    margin:12px 0;

    line-height:1.6;

}


.cursor{

    animation:blink 1s infinite;

}


@keyframes blink{

    50%{
        opacity:0;
    }

}


/* =========================================================
   BOY / GIRL GRAPHICS
========================================================= */

.characters{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:25px;

    margin-top:50px;

}


.character{

    padding:30px 25px;

    background:
    rgba(255,255,255,.045);

    border:
    1px solid rgba(180,210,220,.18);

    border-radius:18px;

    backdrop-filter:blur(8px);

    transition:.4s;

}


.character:hover{

    transform:translateY(-8px);

    background:
    rgba(255,255,255,.08);

}


.avatar{

    width:110px;

    height:110px;

    margin:0 auto 20px;

    position:relative;

}


.head{

    width:65px;

    height:65px;

    background:#d8b08b;

    border-radius:50%;

    position:absolute;

    left:22px;

    top:15px;

    z-index:2;

}


.hair-boy{

    width:68px;

    height:34px;

    background:#25272a;

    border-radius:50% 50% 20% 20%;

    position:absolute;

    left:20px;

    top:10px;

    z-index:3;

}


.hair-girl{

    width:78px;

    height:78px;

    background:#29252b;

    border-radius:50%;

    position:absolute;

    left:16px;

    top:9px;

    z-index:1;

}


.face{

    position:absolute;

    left:39px;

    top:43px;

    z-index:4;

    font-size:13px;

}


.body{

    width:75px;

    height:55px;

    background:#526f7b;

    border-radius:35px 35px 10px 10px;

    position:absolute;

    left:18px;

    top:72px;

}


.girl-body{

    background:#705b70;

}


.character h3{

    letter-spacing:3px;

    font-size:13px;

    margin-bottom:15px;

}


.character p{

    color:#b9c8ce;

    line-height:1.8;

}


/* =========================================================
   STATS
========================================================= */

.stats{

    max-width:700px;

    margin:45px auto;

}


.stat{

    margin:25px 0;

    text-align:left;

}


.stat-head{

    display:flex;

    justify-content:space-between;

    color:#c7d6da;

    font-size:13px;

    margin-bottom:8px;

}


.stat-bar{

    height:8px;

    background:rgba(255,255,255,.07);

    border-radius:20px;

    overflow:hidden;

}


.stat-fill{

    height:100%;

    width:0;

    background:#91b8c6;

    transition:
    width 1.5s cubic-bezier(.22,1,.36,1);

}


/* =========================================================
   FUNNY CARDS
========================================================= */

.cards{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(210px,1fr));

    gap:18px;

    margin-top:45px;

}


.card{

    padding:27px;

    background:
    rgba(255,255,255,.04);

    border:
    1px solid rgba(190,215,225,.14);

    border-radius:14px;

    text-align:left;

    transition:.35s;

}


.card:hover{

    transform:
    translateY(-6px)
    rotate(.5deg);

}


.card small{

    color:#7fa5b5;

    letter-spacing:2px;

}


.card h3{

    margin:13px 0;

}


.card p{

    color:#afc0c7;

    line-height:1.7;

}

   D
